  <script>
    (function () {
      // classes are frame-prefixed (f05-), so document-level lookups are collision-safe
      // (the host slot may carry the same data-composition-id as this root)
      var R = document;
      var q = function (s) { return R.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };
      var panel = q(".f05-panel");

      var dragonfly =
        '<svg width="62" height="62" viewBox="0 0 60 60" fill="#e0ebd2" stroke="#23350e" stroke-width="3" stroke-linecap="round">' +
        '<ellipse cx="17" cy="21" rx="13" ry="5" transform="rotate(-14 17 21)"/>' +
        '<ellipse cx="43" cy="21" rx="13" ry="5" transform="rotate(14 43 21)"/>' +
        '<ellipse cx="19" cy="30" rx="11" ry="4.5" transform="rotate(12 19 30)"/>' +
        '<ellipse cx="41" cy="30" rx="11" ry="4.5" transform="rotate(-12 41 30)"/>' +
        '<line x1="30" y1="16" x2="30" y2="54"/>' +
        '<circle cx="30" cy="11" r="5" fill="#82954b"/></svg>';

      var items = [
        { icon: "🌹", word: "ดอกกุหลาบ", fill: "#fdf3d0", x: 32, y: 156 },
        { icon: dragonfly, word: "แมลงปอ", fill: "#f0f7e6", x: 448, y: 156 },
        { icon: "🪑", word: "ม้านั่ง", fill: "#e8ede0", x: 32, y: 324 },
        { icon: "🌈", word: "สายรุ้ง", fill: "#e0ebd2", x: 448, y: 324 },
        { icon: "🧺", word: "ตะกร้า", fill: "#fff9e6", x: 240, y: 492 }
      ];
      // pollen offsets relative to card top-left (deterministic)
      var pollenOff = [[-10, 22], [384, 10], [356, 140], [60, 142], [196, -12]];

      items.forEach(function (it, i) {
        var g = document.createElement("div");
        g.className = "f05-glow f05-glow-" + i;
        g.style.left = it.x - 100 + "px";
        g.style.top = it.y - 91 + "px";
        panel.appendChild(g);
      });
      items.forEach(function (it, i) {
        var c = document.createElement("div");
        c.className = "f05-card f05-card-" + i;
        c.style.left = it.x + "px";
        c.style.top = it.y + "px";
        c.innerHTML =
          '<div class="f05-icon" style="background:' + it.fill + '">' + it.icon + "</div>" +
          '<div class="f05-word">' + it.word + "</div>";
        panel.appendChild(c);
        for (var k = 0; k < 3; k++) {
          var o = pollenOff[(i + k * 2) % 5];
          var p = document.createElement("div");
          p.className = "f05-pollen f05-pollen-" + i;
          p.style.left = it.x + o[0] + "px";
          p.style.top = it.y + o[1] + "px";
          panel.appendChild(p);
        }
      });

      var F = 1 / 60;
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.6): rail, tag, headline, empty glass panel + 🔊 ----
      tl.fromTo(qa(".f05-dot"), { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.03 }, 0.05);
      tl.fromTo(q(".f05-tag"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.12);
      tl.fromTo(q(".f05-h1"), { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 0.25);
      tl.fromTo(q(".f05-h2"), { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 0.5);
      tl.fromTo(q(".f05-hl"), { scale: 0.82, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.55);
      tl.fromTo(q(".f05-glass"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.45);
      tl.fromTo(q(".f05-plabel"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.75);
      tl.fromTo(q(".f05-tts"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.85);
      tl.fromTo(q(".f05-ttslabel"), { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.0);

      // slow camera push-in underneath the whole shot (rail stays outside, static)
      tl.fromTo(q(".f05-cam"), { scale: 1 }, { scale: 1.025, duration: 4.8, ease: "sine.inOut" }, 1.1);

      // ---- Scene 2 (1.6–4.2): waterfall-entry of 5 word cards + pollen glow ----
      var t = 1.7;
      var specs = [
        { y: 80, d: 0.18 },
        { y: 50, d: 0.15 },
        { y: 46, d: 0.15 },
        { y: 44, d: 0.14 },
        { y: 70, d: 0.15 }
      ];
      var gaps = [0.1, 0.095, 0.09, 0.08];
      items.forEach(function (it, i) {
        var card = q(".f05-card-" + i);
        tl.set(card, { opacity: 1, y: specs[i].y }, t);
        tl.to(card, { y: 0, duration: specs[i].d, ease: "power4.out" }, t);
        tl.fromTo(q(".f05-glow-" + i), { opacity: 0, scale: 0.6 },
          { opacity: 0.65, scale: 1, duration: 0.5, ease: "power2.out" }, t + 0.05);
        tl.fromTo(qa(".f05-pollen-" + i), { opacity: 0, scale: 0, y: 12 },
          { opacity: 1, scale: 1, y: -10, duration: 0.6, ease: "back.out(2)", stagger: 0.06 }, t + 0.1);
        if (i < gaps.length) t += gaps[i];
      });

      // pollen glow travels card-to-card (a read-through sweep), resting back to a soft glow
      items.forEach(function (it, i) {
        var s = 2.55 + i * 0.3;
        tl.to(q(".f05-glow-" + i), { opacity: 1, scale: 1.1, duration: 0.22, ease: "power2.out" }, s);
        tl.to(q(".f05-glow-" + i), { opacity: 0.6, scale: 1, duration: 0.4, ease: "power2.inOut" }, s + 0.22);
        tl.to(q(".f05-card-" + i + " .f05-icon"), { scale: 1.1, duration: 0.2, ease: "power2.out" }, s);
        tl.to(q(".f05-card-" + i + " .f05-icon"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, s + 0.2);
        tl.to(qa(".f05-pollen-" + i), { y: -18, duration: 0.6, ease: "sine.out" }, s);
      });

      // ---- Scene 3 (4.2–6.0): 🔊 pulses once with soundwave arcs; "ask later" caption; hold ----
      tl.to(q(".f05-tts"), { scale: 1.16, duration: 0.18, ease: "power2.out" }, 4.2);
      tl.to(q(".f05-tts"), { scale: 1, duration: 0.4, ease: "power2.inOut" }, 4.38);
      qa(".f05-arc").forEach(function (a, i) {
        var s = 4.25 + i * 0.09;
        tl.fromTo(a, { opacity: 0, scale: 0.85, transformOrigin: "0% 50%" },
          { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, s);
        tl.to(a, { opacity: 0.4, duration: 0.5, ease: "power1.out" }, s + 0.35);
      });
      tl.fromTo(q(".f05-later"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.6);

      // hold to the full 6s duration
      tl.to({}, { duration: 0.01 }, 5.99);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-stage1-memorize"] = tl;
    })();
