      tl.to(Q("step1"), { backgroundColor: "#4a6b22", duration: 0.3, ease: "power1.out" }, 1.0);
      tl.fromTo(Q("sprout"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.35);
      tl.fromTo(Q("line-btn"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.55);

      // cursor-click-ripple: move (fingertip glides in) -> click -> ripple

      tl.to(Q("finger"), { scale: 1, duration: 0.09, ease: "power2.out" }, CLICK_AT + 0.09);
      tl.set([Q("rip1"), Q("rip2"), Q("rip3")], { opacity: 1 }, CLICK_AT + 0.03);

      tl.fromTo(Q("burst"), { scale: 1, opacity: 0 }, { scale: 1.6, opacity: 0.7, duration: 0.4, ease: "power2.out" }, CLICK_AT + 0.12);
      tl.to(Q("burst"), { opacity: 0, duration: 0.35, ease: "power2.in" }, CLICK_AT + 0.52);

      tl.fromTo(Q("cap2"), { opacity: 0, y: 30, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 2.85);
      tl.to(Q("step2"), { backgroundColor: "#4a6b22", duration: 0.3, ease: "power1.out" }, 2.9);

      // ================= Scene 3 (4.6–7.0s): zoom-to-target on the TTS button =================
      var ZOOM_AT = 4.6, ZOOM_DUR = 1.0;

      tl.to(Q("zoom-inner"), { x: -TTS_OFF_X, y: -TTS_OFF_Y, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);

      // three soundwave arcs radiate on the tap, then hold
      tl.fromTo(".f03-login-wave", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.12, immediateRender: false }, TAP_AT + 0.1);
