  <script>
    (function () {
      const ID = "08-stage5-animals";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (sel) => root.querySelector(sel);
      const tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–2.0): title, timer, mic ----------
      tl.fromTo(q("#s8-tag"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.0);
      tl.fromTo(q("#s8-headline"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.08);
      tl.fromTo(q("#s8-card"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      tl.fromTo(q("#s8-time"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.45);
      tl.fromTo(q("#s8-mic"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.75);

      // 60-second bar drains linearly; readout ticks down (compressed clock)
      const DRAIN_AT = 0.7, DRAIN_DUR = 6.3, END_SEC = 19;
      tl.fromTo(q("#s8-fill"), { scaleX: 1 }, { scaleX: END_SEC / 60, duration: DRAIN_DUR, ease: "none" }, DRAIN_AT);
      const readout = q("#s8-readout");
      const clock = { v: 60 };
      tl.fromTo(clock, { v: 60 }, {
        v: END_SEC, duration: DRAIN_DUR, ease: "none",
        onUpdate: () => { readout.textContent = "00:" + String(Math.ceil(clock.v)).padStart(2, "0"); }
      }, DRAIN_AT);

      // mic listening: deterministic wave-bar pulses + ring ripples (finite tweens, no repeat)
      const bars = root.querySelectorAll(".s8-wbar");
      tl.set(bars, { scaleY: 0.25 }, 0);
      const STEP = 0.18, WAVE_FROM = 1.0, WAVE_TO = 5.2;
      for (let k = 0, t = WAVE_FROM; t < WAVE_TO; k++, t += STEP) {
        bars.forEach((b, i) => {
          const s = 0.3 + 0.7 * Math.abs(Math.sin(k * 1.7 + i * 2.3));
          tl.to(b, { scaleY: s, duration: STEP, ease: "sine.inOut" }, t);
        });
      }
      tl.to(bars, { scaleY: 0.25, duration: 0.4, ease: "power2.out" }, WAVE_TO);
      const ring = q("#s8-ring");
      [1.0, 2.2, 3.4, 4.6].forEach((t) => {
        tl.fromTo(ring, { scale: 1, opacity: 0.8 }, { scale: 1.55, opacity: 0, duration: 1.0, ease: "power2.out" }, t);
      });

      // ---------- Scene 2 (2.0–5.2): chips fly into the box, counter climbs 0 → 11 ----------
      const animals = [
        "🐘 ช้าง", "🐎 ม้า", "🐄 วัว", "🐅 เสือ", "🐦 นก", "🐟 ปลา",
        "🐕 หมา", "🐈 แมว", "🐒 ลิง", "🐍 งู", "🦆 เป็ด"
      ];
      const fills = ["#ffffff", "#e0ebd2", "#fdf3d0", "#f0f7e6", "#e8ede0", "#e8f5e9"];
      const box = q("#s8-box");
      // box sits at absolute (936, 278); mic icon centre at (188, 624)
      const BOX_X = 900 + 2 + 34, BOX_Y = 150 + 2 + 126;
      const MIC_X = 120 + 2 + 22 + 46, MIC_Y = 548 + 2 + 14 + 46;
      const COUNT_AT = 2.0, COUNT_DUR = 3.2, FLY = 0.5;
      animals.forEach((label, i) => {
        const c = i % 3, r = Math.floor(i / 3);
        const left = 17 + c * 188, top = 52 + r * 112;
        const chip = document.createElement("div");
        chip.className = "s8-chip";
        chip.style.left = left + "px";
        chip.style.top = top + "px";
        chip.style.background = fills[i % fills.length];
        chip.textContent = label;
        box.appendChild(chip);
        // landing time matches the counter's power1.out curve crossing (i + 0.5)
        const y = (i + 0.5) / 11;
        const land = COUNT_AT + COUNT_DUR * (1 - Math.sqrt(1 - y));
        const dx = MIC_X - (BOX_X + left + 86);
        const dy = MIC_Y - (BOX_Y + top + 42);
        tl.fromTo(chip,
          { x: dx, y: dy, scale: 0.35, opacity: 0, rotation: i % 2 ? 10 : -10 },
          { x: 0, y: 0, scale: 1, opacity: 1, rotation: 0, duration: FLY, ease: "power3.out" },
          land - FLY * 0.6);
      });

      const tile = q("#s8-tile");
      tl.fromTo(q("#s8-tile-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.2);
      tl.fromTo(q("#s8-goal"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.45);

      const counter = q("#s8-count");
      const state = { value: 0 };
      tl.fromTo(state, { value: 0 }, {
        value: 11, duration: COUNT_DUR, ease: "power1.out",
        onUpdate: () => { counter.textContent = String(Math.round(state.value)); }
      }, COUNT_AT);
      tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: "power1.out" }, COUNT_AT);

      // ---------- Scene 3 (5.2–7.0): full marks ----------
      const HIT = COUNT_AT + COUNT_DUR; // 5.2
      tl.to(counter, { color: "#4a6b22", duration: 0.35, ease: "power2.out" }, HIT);
      tl.fromTo(q("#s8-tile-bg"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, HIT);
      tl.fromTo(q("#s8-check"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, HIT + 0.05);
      tl.to(box, { borderColor: "#4a6b22", backgroundColor: "#f0f7e6", duration: 0.35, ease: "power2.out" }, HIT);
      tl.fromTo(q("#s8-badge"),
        { scale: 0, opacity: 0, rotation: -4 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.7)" }, HIT + 0.12);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
