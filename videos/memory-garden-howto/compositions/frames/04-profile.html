  <script>
    (function () {
      var D = 6;
      var tl = gsap.timeline({ paused: true });
      var $ = function (id) { return document.getElementById(id); };

      // ---------- Scene 1: surface establishes (hero visible by 0.5s) ----------
      tl.fromTo("#p04-card", { opacity: 0, scale: 0.94, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);
      tl.fromTo("#p04-step", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.fromTo("#p04-head", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#p04-accent", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.55);
      ["#p04-row0", "#p04-row1", "#p04-row2", "#p04-row3"].forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15 + i * 0.06);
      });
      tl.fromTo("#p04-btn", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.4);
      // locked camera: slow push toward the form
      tl.fromTo("#p04-stage", { scale: 1 }, { scale: 1.025, duration: D, ease: "none" }, 0);

      // ---------- type-on (discrete-text-sequence) ----------
      var SEQ = [
        [ { t: 0, s: "" }, { t: 0.45, s: "ค" }, { t: 0.55, s: "คุ" }, { t: 0.66, s: "คุณ" },
          { t: 0.95, s: "คุณส" }, { t: 1.05, s: "คุณสม" }, { t: 1.16, s: "คุณสมศ" }, { t: 1.28, s: "คุณสมศรี" } ],
        [ { t: 0, s: "" }, { t: 1.5, s: "6" }, { t: 1.62, s: "68" } ],
        [ { t: 0, s: "" }, { t: 1.88, s: "ห" }, { t: 2.0, s: "หญิ" }, { t: 2.12, s: "หญิง" } ]
      ];
      var ACTIVE = [ [0.3, 1.42], [1.42, 1.8], [1.8, 2.4] ];
      var txt = [$("p04-t0"), $("p04-t1"), $("p04-t2")];
      var car = [$("p04-c0"), $("p04-c1"), $("p04-c2")];
      function at(seq, t) {
        for (var i = seq.length - 1; i >= 0; i--) if (t >= seq[i].t) return seq[i].s;
        return "";
      }
      var drv = { t: 0 };
      tl.to(drv, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          var t = drv.t;
          var blinkOn = Math.sin(t * Math.PI * 2 / 0.6) > -0.2;
          for (var k = 0; k < 3; k++) {
            txt[k].textContent = at(SEQ[k], t);
            var a = ACTIVE[k];
            car[k].style.opacity = (t >= a[0] && t < a[1] && blinkOn) ? "1" : "0";
          }
          // education row content swap on tap
          var e = $("p04-t3");
          if (t >= 2.72) { e.textContent = "ประถม – ม.6"; e.className = ""; }
          else { e.textContent = "เลือก"; e.className = "p04-ph"; }
        }
      }, 0);

      // ---------- Scene 2: fingertip taps the education row ----------
      // finger tip (top-left area of the emoji) lands at target coords
      var EDU = { x: 1520, y: 634 };     // education field centre (stage px)
      var BTN = { x: 1500, y: 765 };     // button centre
      tl.fromTo("#p04-finger", { x: 1880, y: 1000, opacity: 0 }, { x: 1700, y: 860, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.7);
      tl.to("#p04-finger", { x: EDU.x - 44, y: EDU.y - 4, duration: 0.6, ease: "power3.inOut" }, 2.1);
      tl.to("#p04-finger", { scale: 0.86, duration: 0.1, ease: "power1.in" }, 2.66);
      tl.to("#p04-finger", { scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 2.76);
      tl.fromTo("#p04-ripple", { x: EDU.x, y: EDU.y, scale: 0.3, opacity: 0 }, { opacity: 0.9, duration: 0.04, ease: "none" }, 2.72);
      tl.to("#p04-ripple", { scale: 2.6, opacity: 0, duration: 0.6, ease: "power2.out" }, 2.76);
      tl.fromTo("#p04-selfill", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.72);
      tl.fromTo("#p04-chev", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, 2.72);
      tl.fromTo("#p04-check", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 2.8);

      // badge springs out of the row (playful overshoot exception) then parks at card top-right
      // final slot: left 1560 / top 50 (straddles card top-right corner); starts over the education row
      tl.fromTo("#p04-badge",
        { x: -270, y: 570, scale: 0, opacity: 0, rotation: -8 },
        { x: -270, y: 500, scale: 1.15, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 2.95);
      tl.to("#p04-badge", { x: 0, y: 0, scale: 1, rotation: 6, duration: 0.6, ease: "power3.inOut" }, 3.5);

      tl.fromTo("#p04-note", { opacity: 0, scale: 0.9, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.4);

      // ---------- Scene 3: press "ถัดไป" (press-release-spring) ----------
      tl.to("#p04-finger", { x: BTN.x - 44, y: BTN.y - 4, duration: 0.5, ease: "power3.inOut" }, 4.0);
      var PS = 4.55, PD = 0.15, RD = 0.6;
      tl.to("#p04-finger", { scale: 0.86, duration: PD, ease: "power1.in" }, PS);
      tl.to("#p04-finger", { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, PS + PD);
      tl.to("#p04-btn", { scale: 0.92, boxShadow: "2px 2px 0 rgba(35,53,14,0.14)", duration: PD, ease: "power1.in" }, PS);
      tl.to("#p04-btn", { scale: 1, boxShadow: "8px 8px 0 rgba(35,53,14,0.14)", duration: RD, ease: "back.out(1.8)" }, PS + PD);
      tl.fromTo("#p04-burst", { scale: 1, opacity: 0 }, { scale: 1.35, opacity: 0.8, duration: 0.45, ease: "power2.out" }, PS + PD);
      tl.to("#p04-burst", { opacity: 0.35, duration: 0.5, ease: "power2.in" }, PS + PD + 0.45);

      // hold to end
      tl.to({}, { duration: 0.01 }, D - 0.01);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-profile"] = tl;
    })();
