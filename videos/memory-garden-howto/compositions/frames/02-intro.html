    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById("02-intro-" + id);
        const tl = gsap.timeline({ paused: true });

        // ---- wallpaper: flat floating pills settle in, then drift very slowly (no exits) ----
        for (let i = 1; i <= 6; i++) {
          const el = $("float-" + i);
          tl.fromTo(
            el,
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
            0.05 + (i - 1) * 0.06,
          );
          tl.fromTo(
            el,
            { y: 0 },
            { y: i % 2 ? -14 : 12, duration: 5.2, ease: "none" },
            0.8,
          );
        }

        // ---- Scene 1 (0.0–1.8s): three leaves converge outer→center (center-outward-expansion run inward) ----
        // start = far off-frame offsets, end = resting tuck around the badge center
        const leaves = [
          { el: $("leaf-1"), from: { x: -760, y: -520, r: -120 }, to: { x: -118, y: -104, r: -38 } },
          { el: $("leaf-2"), from: { x: 1500, y: -560, r: 140 }, to: { x: 122, y: -100, r: 40 } },
          { el: $("leaf-3"), from: { x: -220, y: 900, r: 200 }, to: { x: 4, y: 132, r: 178 } },
        ];
        leaves.forEach((l, i) => {
          tl.fromTo(
            l.el,
            { xPercent: -50, yPercent: -50, x: l.from.x, y: l.from.y, rotation: l.from.r, scale: 0.7, opacity: 0 },
            {
              x: l.to.x,
              y: l.to.y,
              rotation: l.to.r,
              scale: 1,
              opacity: 1,
              duration: 0.85,
              ease: "power3.out",
            },
            0.0 + i * 0.07,
          );
        });

        // badge forms where the leaves meet
        tl.fromTo(
          $("badge"),
          { scale: 0, opacity: 0, rotation: -12 },
          { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "power3.out" },
          0.42,
        );
        tl.fromTo(
          $("badge-emoji"),
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.62,
        );

        // wordmark: per-word staggered reveal
        const words = [$("word-1"), $("word-2"), $("sub")];
        words.forEach((w, i) => {
          tl.fromTo(
            w,
            { y: 46, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
            0.8 + i * 0.16,
          );
        });
        tl.fromTo(
          $("accent"),
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          1.2,
        );

        // ---- Scene 2 (1.8–4.2s): promise pills pop on VO cues (spring-pop-entrance, smooth) ----
        const pillAt = [2.2, 3.5, 4.4]; // "MoCA 30 คะแนน" · "10 ถึง 15 นาที" · Scene 3 completion
        pillAt.forEach((t, i) => {
          tl.fromTo(
            $("pill-" + (i + 1)),
            { scale: 0, opacity: 0, y: 24 },
            { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            t,
          );
        });

        // ---- Scene 3 (4.2–6.0s): held read; subtle sine jitter on the badge only ----
        const idle = $("badge-idle");
        const phase = { p: 0 };
        const IDLE_START = 4.2;
        const IDLE_DUR = 6.0 - IDLE_START;
        tl.fromTo(
          phase,
          { p: 0 },
          {
            p: Math.PI * 2,
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(phase.p);
              idle.style.transform =
                "translateY(" + (s * -3).toFixed(3) + "px) rotate(" + (s * 0.6).toFixed(3) + "deg)";
            },
          },
          IDLE_START,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["02-intro"] = tl;
      })();
