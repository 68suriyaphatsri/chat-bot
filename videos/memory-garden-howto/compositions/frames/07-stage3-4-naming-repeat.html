  <script>
    (function () {
      var ID = "07-stage3-4-naming-repeat";
      var R = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (s) { return R.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });
      var DUR = 8;

      var wrapL = q(".fr07-wrap-l"), wrapR = q(".fr07-wrap-r");
      var cardL = q(".fr07-card-l"), cardR = q(".fr07-card-r");
      var TILT = 12, OVER = 8;

      // ---------- Scene 1 (0.0–3.8s): left card — split-tilt entry from left wing ----------
      tl.fromTo(wrapL,
        { x: -420, rotateY: TILT + OVER, scale: 0.85, opacity: 0 },
        { x: 0, rotateY: TILT, scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.1);
      tl.fromTo(q(".fr07-copy-l"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);

      var pics = qa(".fr07-card-l .fr07-pic");
      var checks = qa(".fr07-card-l .fr07-check");
      var names = qa(".fr07-card-l .fr07-name");
      tl.fromTo(pics, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)", stagger: 0.08 }, 0.6);
      tl.fromTo(q(".fr07-tally-fill"), { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);

      // each picture is named as the VO goes: ✅ + name, in sequence
      var NAME_AT = [1.35, 1.8, 2.25, 2.7, 3.15];
      NAME_AT.forEach(function (t, i) {
        tl.fromTo(checks[i], { scale: 0, opacity: 0, rotation: -25 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
        tl.fromTo(names[i], { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, t + 0.05);
        tl.to(q(".fr07-tally-fill"), { scaleX: (i + 1) / 5, duration: 0.3, ease: "power2.out" }, t + 0.05);
      });

      // ---------- Scene 2 (3.8–8.0s) ----------
      // rail advances: dot 3 completes (coral), dot 4 becomes current (lime, enlarged)
      var dot3 = q(".fr07-dot3"), dot4 = q(".fr07-dot4");
      tl.fromTo(dot3, { scale: 1.45, backgroundColor: "#82954b" }, { scale: 1.45, backgroundColor: "#82954b", duration: 0.01 }, 0);
      tl.to(dot3, { scale: 1, backgroundColor: "#4a6b22", duration: 0.35, ease: "power2.out" }, 3.8);
      tl.fromTo(dot4, { scale: 1, backgroundColor: "#ffffff" }, { scale: 1.45, backgroundColor: "#82954b", duration: 0.4, ease: "back.out(2)" }, 3.85);

      // right card — mirrored entry from the right wing
      tl.fromTo(wrapR,
        { x: 420, rotateY: -TILT - OVER, scale: 0.85, opacity: 0 },
        { x: 0, rotateY: -TILT, scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, 3.8);
      tl.fromTo(q(".fr07-copy-r"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.2);
      tl.fromTo(q(".fr07-sentence"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.3);

      // inner-edge badges spring-pop (the lone overshoot), left then right
      tl.fromTo(q(".fr07-badge-l"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.6)" }, 4.5);
      tl.fromTo(q(".fr07-badge-r"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.6)" }, 4.8);

      // the heard sentence fades away (must be repeated from memory)
      tl.to(q(".fr07-sentence"), { opacity: 0.12, duration: 0.6, ease: "power1.inOut" }, 5.1);

      // mic + transcript appear, mic pulses on
      tl.fromTo(q(".fr07-mic-wrap"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 4.6);
      tl.fromTo(q(".fr07-transcript"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 4.75);
      tl.fromTo(q(".fr07-mic"), { scale: 1 }, { scale: 1.12, duration: 0.18, ease: "power2.out" }, 5.55);
      tl.to(q(".fr07-mic"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, 5.73);

      // three expanding soundwave rings (finite)
      qa(".fr07-ring").forEach(function (ring, i) {
        tl.fromTo(ring, { scale: 1, opacity: 0 }, { scale: 1, opacity: 0, duration: 0.01 }, 0);
        tl.fromTo(ring, { scale: 1, opacity: 0.85 }, { scale: 2.1, opacity: 0, duration: 1.0, ease: "power1.out", immediateRender: false }, 5.6 + i * 0.4);
      });

      // speech-to-text arrives in discrete chunks (discrete-text-sequence)
      var SEQ = [
        { t: 0.0, text: "" },
        { t: 5.85, text: "ฉัน" },
        { t: 6.05, text: "ฉันชอบ" },
        { t: 6.25, text: "ฉันชอบเดิน" },
        { t: 6.4, text: "ฉันชอบเดินเล่น" },
        { t: 6.8, text: "ฉันชอบเดินเล่นในสวน" },
        { t: 7.0, text: "ฉันชอบเดินเล่นในสวนตอนเช้า" }
      ];
      var T_DONE = 7.15;
      function textAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) { if (time >= SEQ[i].t) return SEQ[i].text; }
        return "";
      }
      var textEl = q(".fr07-text"), cursorEl = q(".fr07-cursor"), okEl = q(".fr07-ok");
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var tt = driver.t;
          textEl.textContent = textAt(tt);
          // cursor blinks only while listening, hides on completion
          var blinkOn = Math.sin(tt * Math.PI * 2 / 0.7) > 0;
          cursorEl.style.opacity = (tt >= 5.6 && tt < T_DONE && blinkOn) ? "1" : "0";
        }
      }, 0);
      tl.fromTo(okEl, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, T_DONE);

      // choice chip: speak OR type
      tl.fromTo(q(".fr07-chip"), { y: 20, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 7.0);

      // phase-opposed idle float on the inner card layer (entry lives on the wrap)
      var idle = { p: 0 };
      tl.fromTo(idle, { p: 0 }, {
        p: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var w = idle.p * Math.PI * 2 / 2.4;
          var ramp = Math.min(1, Math.max(0, (idle.p - 1.0) / 0.6));
          gsap.set(cardL, { y: -5 * Math.sin(w) * ramp });
