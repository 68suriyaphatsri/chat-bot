  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector('[data-composition-id="11-result"] ' + s);
      const qa = (s) => Array.from(document.querySelectorAll('[data-composition-id="11-result"] ' + s));

      // slow continuous camera drift underneath the whole shot
      tl.fromTo(q("#frame-11-result-cam"), { scale: 1 }, { scale: 1, duration: 9, ease: "none" }, 0);

      // ---------- Scene 1 (0.0–2.6s): score card + ring + count-up ----------
      tl.fromTo(q("#frame-11-result-card"), { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0);

      const ring = q("#frame-11-result-ring");
      const LEN = ring.getTotalLength();
      const PCT = 28 / 30;
      ring.style.strokeDasharray = LEN;
      ring.style.strokeDashoffset = LEN;

      const COUNT_AT = 0.3, COUNT_DUR = 1.8, COUNT_EASE = "power3.out";
      const counter = q("#frame-11-result-count");
      const state = { value: 0 };
      tl.fromTo(state, { value: 0 }, {
        value: 28, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: () => { counter.textContent = Math.round(state.value); }
      }, COUNT_AT);
      tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(ring, { strokeDashoffset: LEN }, { strokeDashoffset: LEN * (1 - PCT), duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(q("#frame-11-result-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.7);
      tl.fromTo(q("#frame-11-result-suffix"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.7)" }, COUNT_AT + COUNT_DUR);
      tl.fromTo(q("#frame-11-result-badge"), { opacity: 0, scale: 0.3, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.2)" }, 2.25);

      // domain rows sit as empty tracks until their cue
      tl.fromTo(qa(".frame-11-result-row"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 }, 5.3);

      // ---------- Scene 2 (2.6–5.4s): three risk levels stack in ----------
      tl.fromTo(qa(".frame-11-result-pill"), { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out", stagger: 0.38 }, 2.8);
      tl.fromTo(q("#frame-11-result-hl"), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 4.35);
      tl.fromTo(q("#frame-11-result-check"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 4.55);
      tl.fromTo([q("#frame-11-result-pill-y"), q("#frame-11-result-pill-r")], { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power1.out", immediateRender: false }, 4.45);

      // ---------- Scene 3 (5.4–9.0s): domain bars fill, AI card rises ----------
      qa(".frame-11-result-fill").forEach((el, i) => {
        const pct = parseFloat(el.getAttribute("data-pct"));
        tl.fromTo(el, { scaleX: 0 }, { scaleX: pct, duration: 0.9, ease: "power3.out" }, 5.55 + i * 0.09);
      });

      tl.fromTo(q("#frame-11-result-aiglow"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 6.8);
      tl.fromTo(q("#frame-11-result-ai"), { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 6.9);
      tl.fromTo(q("#frame-11-result-ai-icon"), { scale: 0.3, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.2)" }, 7.15);
      tl.fromTo(q("#frame-11-result-ai-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 7.35);
      tl.fromTo(qa(".frame-11-result-ai-line"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.3 }, 7.5);

      // hold to 9.0s
      tl.set({}, {}, 9);
      window.__timelines["11-result"] = tl;
    })();
