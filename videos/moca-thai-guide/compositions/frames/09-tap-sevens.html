  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var q = function (id) { return document.getElementById(id); };
      var E = "power3.out";

      /* ---------- Scene 1 (0.0–3.5): badge, left title + speech, stage note ---------- */
      tl.fromTo("#tap09-badge", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 0.15);
      tl.fromTo("#tap09-rail", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);
      tl.fromTo("#tap09-divider", { scaleY: 0 }, { scaleY: 1, duration: 1.0, ease: "power3.inOut" }, 0.3);
      tl.fromTo("#tap09-ltitle", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 0.45);
      tl.fromTo("#tap09-lspeech", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 0.9);
      tl.fromTo("#tap09-lquote", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 1.15);
      tl.fromTo("#tap09-note", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 2.7);

      /* ---------- Scene 2 (3.5–6.5): letter strip steps; tap + ripple on each ก ---------- */
      var PITCH = 120, CENTER = 270;
      var letters = ["5", "2", "1", "3", "9", "4", "1", "1"];
      var xAt = function (i) { return CENTER - (i * PITCH + PITCH / 2); };
      tl.fromTo("#tap09-demo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 3.5);
      tl.fromTo("#tap09-strip", { x: xAt(-1) + 60 }, { x: xAt(-1), duration: 0.32, ease: E }, 3.5);

      var ripple = 0;
      for (var i = 0; i < letters.length; i++) {
        var t = 3.85 + i * 0.35;
        var isKo = letters[i] === "1";
        tl.to("#tap09-strip", { x: xAt(i), duration: 0.16, ease: "power2.out" }, t);
        if (i > 0) {
          tl.to("#tap09-l" + (i - 1), { color: "#9a9a9a", scale: 1, duration: 0.14, ease: "power2.out" }, t);
        }
        tl.to("#tap09-l" + i, { color: isKo ? "#1e2bfa" : "#111111", scale: 1.15, duration: 0.14, ease: "power2.out" }, t + 0.06);
        if (isKo) {
          var tp = t + 0.08;
          tl.fromTo("#tap09-hand", { y: 0 }, { y: 16, duration: 0.08, ease: "power2.in", immediateRender: false }, tp);
          tl.to("#tap09-hand", { y: 0, duration: 0.2, ease: "power2.out" }, tp + 0.08);
          var rp = "#tap09-rp" + ripple;
          tl.fromTo(rp, { opacity: 0, scale: 0.35 }, { opacity: 0.75, scale: 0.7, duration: 0.06, ease: "none" }, tp + 0.08);
          tl.to(rp, { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out" }, tp + 0.14);
          ripple++;
        }
      }

      /* ---------- Scene 3 (6.5–8.0): right title + speech ---------- */
      tl.fromTo("#tap09-rtitle", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 6.5);
      tl.fromTo("#tap09-rspeech", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 6.75);
      tl.fromTo("#tap09-rquote", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 6.95);

      /* ---------- Scene 4 (8.0–12.0): hero count-down 100 → 65 ---------- */
      tl.fromTo("#tap09-numwrap", { opacity: 0, scale: 0.7, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: E }, 8.0);

      var numEl = q("tap09-num");
      var STEP0 = 8.55, GAP = 0.65, STEPS = 5;
      var state = { p: 0 };
      var easeOut = function (x) { return 1 - Math.pow(1 - x, 3); };
      var renderCount = function () {
        var p = Math.max(0, Math.min(STEPS, state.p));
        var step = Math.floor(p);
        var frac = p - step;
        if (step >= STEPS) { step = STEPS; frac = 0; }
        var local = Math.min(frac / 0.55, 1);
        var e = easeOut(local);
        numEl.textContent = String(Math.round(100 - 7 * (step + e)));
        var s = 1 - 0.14 * Math.sin(Math.PI * local);
        numEl.style.transform = "scale(" + s.toFixed(4) + ")";
      };
      tl.fromTo(state, { p: 0 }, { p: STEPS, duration: STEPS * GAP, ease: "none", onUpdate: renderCount }, STEP0);

      for (var k = 0; k < STEPS; k++) {
        var ts = STEP0 + k * GAP;
        var chip = "#tap09-c" + k;
        tl.fromTo(chip, { opacity: 0, y: 24, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "back.out(2.2)" }, ts);
        tl.to(chip, { opacity: 0, y: -60, duration: 0.36, ease: "power2.in" }, ts + 0.32);
        // previous value drops into the trail row
        if (k > 0) {
          tl.fromTo("#tap09-a" + k, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: E }, ts + 0.05);
        }
        tl.fromTo("#tap09-t" + k, { opacity: 0, y: -46 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, ts + 0.08);
      }
      var tEnd = STEP0 + STEPS * GAP; // 11.8
      tl.fromTo("#tap09-a5", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: E }, tEnd - 0.1);
      tl.fromTo("#tap09-t5", { opacity: 0, y: -46 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, tEnd);

      /* ---------- Scene 5 (12.0–14.0): hold, soft glow settles behind the hero ---------- */
      tl.fromTo("#tap09-glow", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 11.7);

      tl.to({}, { duration: 0.01 }, 13.99);

      window.__timelines["09-tap-sevens"] = tl;
    })();
