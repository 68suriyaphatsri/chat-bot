  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var FID = "07-memory";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function byId(n) { return document.getElementById(FID + "-" + n); }
      function all(n) { return Array.prototype.slice.call(root.querySelectorAll("." + CSS.escape(FID + "-" + n))); }

      var badge = byId("badge");
      var speech = byId("speech");
      var label = speech.querySelector("." + CSS.escape(FID + "-label"));
      var qlines = all("qline");
      var round = byId("round");
      var r1 = byId("r1");
      var r2 = byId("r2");
      var note = byId("note");
      var chips = all("chip");
      var words = all("word");
      var dots = all("dot");
      var rings = all("ring");
      var ulines = all("uline");
      var remind = byId("remind");
      var bmPath = byId("bm-path");
      var rbody = remind.querySelector("." + CSS.escape(FID + "-rbody"));
      var rlabel = rbody.querySelector("." + CSS.escape(FID + "-label"));
      var rlines = all("rline");
      var rail = byId("rail");

      var INK = "#111111";
      var COBALT = "#1e2bfa";

      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      /* Scene 1 (0.0–4.0): badge, speech card slides up, quote reveals by line */
      tl.fromTo(rail, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
      tl.fromTo(badge, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6 }, 0.1);
      tl.fromTo(speech, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 }, 0.3);
      tl.fromTo(label, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.55);
      tl.fromTo(qlines[0], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7 }, 0.8);
      tl.fromTo(qlines[1], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7 }, 1.75);
      tl.fromTo(qlines[2], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7 }, 2.7);

      /* Scene 2 (4.0–9.5): round 1 tag + stage note, five words land ~1s apart */
      tl.to(speech, { opacity: 0.6, duration: 0.8, ease: "power2.inOut" }, 4.0);
      tl.fromTo(round, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 4.0);
      tl.fromTo(r2, { yPercent: 100, opacity: 0 }, { yPercent: 100, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(note, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.6 }, 4.25);

      var LAND = [4.8, 5.8, 6.8, 7.8, 8.8];
      chips.forEach(function (chip, i) {
        var t = LAND[i];
        tl.fromTo(chip, { opacity: 0, y: 36, scale: 0.88 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, t);
        tl.fromTo(dots[i], { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.1);
        tl.fromTo(rings[i], { scale: 1, opacity: 0.7 },
          { scale: 3.2, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, t + 0.15);
        tl.fromTo(ulines[i], { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
      });

      /* Scene 3 (9.5–11.0): tag flips to round 2, chips re-highlight in a quick cobalt sweep */
      tl.to(r1, { yPercent: -100, opacity: 0, duration: 0.4, ease: "power3.in" }, 9.5);
      tl.fromTo(r2, { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, immediateRender: false }, 9.75);

      var SWEEP0 = 10.0, STEP = 0.2;
      chips.forEach(function (chip, i) {
        var t = SWEEP0 + i * STEP;
        tl.to(ulines[i], { scaleX: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to(words[i], { color: COBALT, duration: 0.15, ease: "none" }, t);
        tl.to(words[i], { color: INK, duration: 0.35, ease: "power1.out" }, t + 0.25);
        tl.to(chip, { backgroundColor: "rgba(30, 43, 250, 0.08)", duration: 0.2, ease: "none" }, t);
        tl.fromTo(rings[i], { scale: 1, opacity: 0.6 },
          { scale: 2.6, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
      });

      /* Scene 4 (11.0–13.5): reminder card slides up beneath the strip with a bookmark */
      tl.fromTo(remind, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.8 }, 11.0);
      tl.fromTo(bmPath, { attr: { "stroke-dashoffset": 100 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 11.25);
      tl.fromTo(rlabel, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.3);
      tl.fromTo(rlines[0], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7 }, 11.45);
      tl.fromTo(rlines[1], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7 }, 12.4);

      /* Scene 5 (13.5–16.0): still hold — pad the timeline to the full duration */
      tl.set({}, {}, 16);

      window.__timelines[FID] = tl;
    })();
  </script>
