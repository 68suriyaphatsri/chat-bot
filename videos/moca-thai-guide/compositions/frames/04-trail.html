  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-trail"]');
      var q = function (sel) { return root.querySelector(sel); };
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.5s): badge + sub-title in, circles pop in scattered ----
      tl.fromTo(q("#t04-badge"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
      tl.fromTo(q("#t04-sub"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo(q("#t04-rail"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);

      // scattered (non-sequential) pop order so it reads like the printed form
      var popOrder = [8, 0, 1, 9, 2, 5, 3, 7, 4, 6];
      popOrder.forEach(function (n, i) {
        tl.fromTo(
          q("#t04-n" + n),
          { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.45, ease: "back.out(2)" },
          0.25 + i * 0.1
        );
      });

      // ---- Scene 2 (1.5–4.5s): speech card slides up, quote reveals by line ----
      tl.fromTo(q("#t04-card"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.5);
      tl.fromTo(q("#t04-card-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.75);
      ["#t04-q1", "#t04-q2", "#t04-q3", "#t04-q4"].forEach(function (id, i) {
        tl.fromTo(q(id), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.95 + i * 0.65);
      });

      // ---- Scene 3 (4.5–10.0s): path draws segment by segment, targets fill cobalt ----
      var fillNode = function (n, at) {
        var g = q("#t04-n" + n);
        tl.fromTo(g.querySelector("circle"), { fill: "#fdfae7" }, { fill: "#1e2bfa", duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(g.querySelector("text"), { fill: "#111111" }, { fill: "#fdfae7", duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(g, { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.12, transformOrigin: "50% 50%", duration: 0.14, ease: "power2.out" }, at);
        tl.to(g, { scale: 1, duration: 0.3, ease: "power3.out" }, at + 0.14);
      };

      // start node + "เริ่ม" tag with the first segment
      fillNode(0, 4.5);
      tl.fromTo(q("#t04-tag-start"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.55);

      var segStart = 4.62, step = 0.58, segDur = 0.48;
      for (var s = 1; s <= 9; s++) {
        var line = q("#t04-s" + s);
        var x1 = +line.getAttribute("x1"), y1 = +line.getAttribute("y1");
        var x2 = +line.getAttribute("x2"), y2 = +line.getAttribute("y2");
        var len = Math.ceil(Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1)));
        var at = segStart + (s - 1) * step;
        tl.fromTo(
          line,
          { strokeDasharray: len, strokeDashoffset: len },
          { strokeDasharray: len, strokeDashoffset: 0, duration: segDur, ease: "power2.inOut" },
          at
        );
        fillNode(s, at + segDur - 0.06);
      }

      // "จบ" tag with the last segment
      var lastEnd = segStart + 8 * step + segDur;
      tl.fromTo(q("#t04-tag-end"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, lastEnd - 0.05);

      // ---- Scene 4 (10.0–12.0s): hold still ----
      tl.set({}, {}, 12);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-trail"] = tl;
    })();
  </script>
