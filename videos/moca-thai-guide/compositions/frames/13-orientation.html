      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

          { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.08 }, t + 0.15);

        tl.fromTo(within(card, "13-orientation-q"),
          { opacity: 0, y: 20 },
